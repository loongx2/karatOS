[package]
name = "hello"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["karatOS Contributors"]
description = "First loadable karatOS module: proves extensible + retractable code"

# Links against a FIXED RAM slot address (module.x, generated by build.rs).
# No relocations: the kernel verifies + copies the raw image and calls in.
[[bin]]
name = "hello"
path = "src/main.rs"

[dependencies]
# The ABI crate is the ONLY thing a module may depend on — it compiles to
# nothing and pins the kernel<->module contract.
karatos-kapi = { path = "../../kapi" }