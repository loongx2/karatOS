[workspace]
members = ["kernel"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["karatOS Contributors"]
repository = "https://github.com/loongx2/karatOS"

[profile.dev]
panic = "abort"
lto = false

# Release profile is hardened for the 64 kB ROM/SRAM budget (Milestone 3):
#   opt-level="z"  - optimize for size
#   lto="fat"      - link-time optimization across all crates
#   codegen-units=1- maximal cross-function optimization
#   strip        - drop symbols/debug sections from the final ELF
[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
debug = false
overflow-checks = false
